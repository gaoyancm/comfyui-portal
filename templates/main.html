<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>ComfyUI Portal</title>
  <link rel="stylesheet" href="/static/app.css" />
  <script src="/static/app_main.js"></script>
</head>
<body>
  <div class="wrap">
    <div class="nav">
      <div class="brand">AI轻创业 · <b>视频技术1.0</b></div>
      <div id="userbar" class="pill"></div>
    </div>
    <div class="row">
      <div class="card wide">
        <h3>选择工作流并填写表单</h3>
        <div>
          <label>工作流</label>
          <select id="wfSelect">
            {% if workflows %}
              {% for item in workflows %}
                <option value="{{ item.workflow }}"{% if loop.first %} selected{% endif %}>{{ item.workflow }}{% if not item.has_form %} (无表单){% endif %}</option>
              {% endfor %}
            {% else %}
              <option value="" disabled selected>暂无可用工作流</option>
            {% endif %}
          </select>
          <div id="wfStatus" class="muted" style="display:none"></div>
        </div>
        <form id="jobForm">
          <input type="hidden" name="workflow" id="wfInput" value="{{ default_workflow or '' }}" />
          <input type="hidden" name="form_mode" value="1" />
          <div id="formFields"></div>
          <div style="margin-top:8px">
            <button type="submit" class="btn">提交任务</button>
          </div>
        </form>
        <div id="createResp" class="muted"></div>
      </div>
      <div class="card wide">
        <h3>任务状态</h3>
        <input id="jobId" placeholder="job_id" />
        <div style="margin:6px 0 10px">
          <button id="btnPoll" class="btn">开始轮询</button>
          <a class="btn ghost" href="/history" target="_blank" rel="noopener" style="margin-left:8px">历史</a>
        </div>
        <div id="topline" class="muted" style="margin:6px 0 8px">
          排队：<b id="queueCount">-</b> · 状态：<b id="stateText">-</b>
        </div>
        <div id="longWorkflowNotice" class="notice" style="display:none">
          由于生成视频时间较长，请耐心等待，不要连续点击生成按钮。
        </div>
        <div id="jobError" class="error-text" style="display:none;margin:6px 0"></div>
        <div id="progWrap" style="display:none;margin:8px 0 6px">
          <div style="height:10px;background:#0b1324;border:1px solid var(--border);border-radius:8px;overflow:hidden">
            <div id="progBar" style="height:100%;width:0;background:linear-gradient(90deg, var(--primary), var(--accent))"></div>
          </div>
          <div id="progText" class="muted" style="margin-top:4px"></div>
        </div>
        <div id="images"></div>
        <div style="margin-top:10px">
          <a id="btnToggleDetails" class="btn ghost" href="javascript:void(0)">显示详情</a>
        </div>
        <div id="details" style="display:none;margin-top:8px">
          <pre id="detailsPre"></pre>
        </div>
      </div>
    </div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', ()=>{ window.PortalMain && window.PortalMain(); });
  </script>
</body>
</html>
