<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>任务历史 - ComfyUI Portal</title>
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <div class="wrap">
  <div class="nav"><div class="brand">ComfyUI Portal · <b>任务历史</b></div><a class="pill" href="/">返回</a></div>
  <div class="card">
  <div class="muted" id="userbar" style="margin-bottom:8px"></div>
  <div style="margin:8px 0; display:flex; gap:8px; align-items:center;">
    <button class="btn" id="btnRefresh">刷新</button>
    <div class="muted" id="msg" aria-live="polite"></div>
  </div>
  <table id="tbl">
    <thead>
      <tr>
        <th>时间</th>
        <th>任务ID</th>
        <th>工作流</th>
        <th>状态</th>
        <th>进度</th>
        <th>产物</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  </div>
  </div>

<script>
const $ = s => document.querySelector(s);
function ts(t){ if(!t) return ''; const d = new Date(t * 1000); return d.toLocaleString(); }
async function authBar(){
  const r = await fetch('/auth/status');
  if(r.status === 401){ location.href = '/login'; return; }
  const j = await r.json();
  $('#userbar').textContent = `已登录：${j.user||''}`;
}

let lastItems = [];

function render(items){
  const tb = $('#tbl tbody');
  tb.innerHTML = '';
  if(!items.length){
    const tr = document.createElement('tr');
    const td = document.createElement('td');
    td.colSpan = 7;
    td.className = 'muted';
    td.textContent = '暂无历史任务';
    tr.appendChild(td);
    tb.appendChild(tr);
    return;
  }

  items.forEach(it => {
    const tr = document.createElement('tr');
    const dlZip = `/api/jobs/${it.job_id}/download.zip`;
    const viewStatus = `/api/jobs/${it.job_id}/status`;
    tr.innerHTML = `
      <td>${ts(it.created_at)}</td>
      <td class="muted">${it.job_id}</td>
      <td>${it.workflow||''}</td>
      <td>${it.status||''}</td>
      <td>${it.progress??''}%</td>
      <td>${it.outputs||0}</td>
      <td class="actions"><a href="${viewStatus}" target="_blank">查看状态</a>${it.outputs?`<a href="${dlZip}">打包下载</a>`:''}</td>
    `;
    tb.appendChild(tr);
  });
}

async function load(){
  const msg = $('#msg');
  msg.textContent = '';
  try{
    const url = `/api/jobs?ts=${Date.now()}`;
    const r = await fetch(url, {cache:'no-store'});
    if(!r.ok){
      throw new Error(`请求失败：${r.status}`);
    }
    const j = await r.json();
    const items = Array.isArray(j.items) ? j.items : [];
    lastItems = items;
    render(items);
    msg.textContent = `共 ${items.length} 条记录`;
  }catch(err){
    console.error(err);
    if(lastItems.length){
      render(lastItems);
    }else{
      render([]);
    }
    msg.textContent = '无法读取最新历史记录，请稍后重试';
  }
}

$('#btnRefresh').addEventListener('click', load);
authBar();
render(lastItems);
load();
</script>
</body>
</html>
