<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>任务历史 - ComfyUI Portal</title>
  <style>
    body{font-family:system-ui,Segoe UI,Arial;margin:20px}
    table{border-collapse:collapse;width:100%}
    th,td{border:1px solid #ddd;padding:8px;text-align:left}
    th{background:#f5f5f5}
    .muted{color:#666}
    .actions a{margin-right:8px}
  </style>
</head>
<body>
  <h2>任务历史</h2>
  <div class="muted" id="userbar"></div>
  <div style="margin:8px 0">
    <a href="/">返回工作流面板</a>
    <button id="btnRefresh" style="margin-left:8px">刷新</button>
  </div>
  <table id="tbl">
    <thead>
      <tr>
        <th>时间</th>
        <th>任务ID</th>
        <th>工作流</th>
        <th>状态</th>
        <th>进度</th>
        <th>产物</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

<script>
const $ = s=>document.querySelector(s);
function ts(t){ if(!t) return ''; const d=new Date(t*1000); return d.toLocaleString(); }
async function authBar(){ const r=await fetch('/auth/status'); if(r.status===401){ location.href='/login'; return; } const j=await r.json(); $('#userbar').textContent=`已登录：${j.user||''}`; }
async function load(){
  const r = await fetch('/api/jobs'); const j = await r.json();
  const tb = $('#tbl tbody'); tb.innerHTML='';
  (j.items||[]).forEach(it=>{
    const tr = document.createElement('tr');
    const dlZip = `/api/jobs/${it.job_id}/download.zip`;
    const viewStatus = `/api/jobs/${it.job_id}/status`;
    tr.innerHTML = `
      <td>${ts(it.created_at)}</td>
      <td class="muted">${it.job_id}</td>
      <td>${it.workflow||''}</td>
      <td>${it.status||''}</td>
      <td>${it.progress??''}%</td>
      <td>${it.outputs||0}</td>
      <td class="actions"><a href="${viewStatus}" target="_blank">查看状态</a>${it.outputs?`<a href="${dlZip}">打包下载</a>`:''}</td>
    `;
    tb.appendChild(tr);
  });
}
$('#btnRefresh').addEventListener('click', load);
authBar(); load();
</script>
</body>
</html>
