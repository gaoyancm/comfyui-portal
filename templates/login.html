<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>登录 - ComfyUI Portal</title>
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body class="auth-shell">
  <div class="auth-card">
    <div class="auth-title">登录</div>
    <div class="hint">AI轻创业 · 视频技术1.0 · 请输入账号密码</div>
    <form id="f">
      <label>用户名</label>
      <input name="username" autocomplete="username" placeholder="your name" />
      <label>密码</label>
      <input type="password" name="password" autocomplete="current-password" placeholder="password" />
      <div style="margin-top:12px;display:flex;gap:10px">
        <button type="submit" class="btn" style="flex:1">登录</button>
        <a class="btn ghost" href="/" style="flex:1;text-align:center">返回首页</a>
      </div>
      <div id="err" class="muted" style="margin-top:10px;min-height:20px"></div>
    </form>
  </div>

<script>
const $=s=>document.querySelector(s);
document.getElementById('f').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const fd = new FormData(e.target);
  const body = new URLSearchParams();
  for (const [k,v] of fd.entries()) body.append(k,v);
  try{
    const res = await fetch('/login', {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body});
    const j = await res.json();
    if(j.ok){ location.href = '/'; }
    else { $('#err').textContent = j.msg || '登录失败'; }
  }catch(err){ $('#err').textContent = err+''; }
});
</script>
</body>
</html>
